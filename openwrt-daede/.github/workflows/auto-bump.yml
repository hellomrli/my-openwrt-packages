name: Auto bump dae/daed

# Tracks the aggressive combo (daeuniverse + olicesx perf forks), gates on a real
# SDK build, and only then publishes. main stays clean until the gate is green:
# all work happens on auto-bump-staging; main is fast-forwarded only on success.

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

env:
  STAGING: auto-bump-staging

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect upstream changes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          . ci/pins.env
          daed_new=$(git ls-remote https://github.com/daeuniverse/daed HEAD | cut -f1)
          wing_new=$(git ls-remote https://github.com/daeuniverse/dae-wing HEAD | cut -f1)
          # route A: track upstream dae main (merged onto the olicesx perf base at
          # assemble time), not the olicesx kdae fork, so the core stays fresh.
          core_up_new=$(git ls-remote https://github.com/daeuniverse/dae main | cut -f1)
          outbound_new=$(git ls-remote https://github.com/olicesx/outbound perf/complete-optimizations | cut -f1)
          # quic-go is not auto-tracked, but outbound pins it by pseudo-version:
          # bumping outbound past our QUICGO_BASE_COMMIT breaks the build (2026-07-31,
          # ReleaseDatagram undefined), so hold outbound until the bases are refreshed.
          outbound_wants=$(curl -fsSL "https://raw.githubusercontent.com/olicesx/outbound/${outbound_new}/go.mod" \
            | grep -E '^replace .*olicesx/quic-go' \
            | sed -E 's/.*-([0-9a-f]{12})[[:space:]]*$/\1/' | tail -1)
          ours_quicgo="$(printf '%s' "$QUICGO_BASE_COMMIT" | cut -c1-12)"
          if [ -n "$outbound_wants" ] && [ "$outbound_wants" != "$ours_quicgo" ]; then
            echo "::warning::outbound ${outbound_new} needs quic-go ${outbound_wants}, ours is ${ours_quicgo}; holding outbound."
            echo "quicgo_mismatch=$outbound_wants" >> "$GITHUB_OUTPUT"
            outbound_new="$OUTBOUND_COMMIT"
          fi
          if [ "$daed_new" = "$DAED_COMMIT" ] && [ "$wing_new" = "$WING_COMMIT" ] \
             && [ "$core_up_new" = "$CORE_UPSTREAM_COMMIT" ] && [ "$outbound_new" = "$OUTBOUND_COMMIT" ]; then
            echo "No upstream change."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          daed_date=$(gh api repos/daeuniverse/daed/commits/$daed_new --jq '.commit.committer.date' | cut -dT -f1 | tr '-' '.')
          wing_date=$(gh api repos/daeuniverse/dae-wing/commits/$wing_new --jq '.commit.committer.date' | cut -dT -f1 | tr '-' '.')
          core_date=$(gh api repos/daeuniverse/dae/commits/$core_up_new --jq '.commit.committer.date' | cut -dT -f1 | tr '-' '.')
          outbound_date=$(gh api repos/olicesx/outbound/commits/$outbound_new --jq '.commit.committer.date' | cut -dT -f1 | tr '-' '.')
          # version = newest component date (YYYY.MM.DD sorts chronologically), used
          # for BOTH dae and daed so the stamp never regresses when only the core moves.
          ver=$(printf '%s\n%s\n%s\n%s\n' "$daed_date" "$wing_date" "$core_date" "$outbound_date" | sort -r | head -1)
          changes=""
          add_change() {
            [ "$2" = "$3" ] && return 0
            changes="${changes:+$changes, }$1 $(printf '%s' "$2" | cut -c1-7)→$(printf '%s' "$3" | cut -c1-7)"
          }
          add_change daed "$DAED_COMMIT" "$daed_new"
          add_change wing "$WING_COMMIT" "$wing_new"
          add_change core "$CORE_UPSTREAM_COMMIT" "$core_up_new"
          add_change outbound "$OUTBOUND_COMMIT" "$outbound_new"
          {
            echo "changed=true"
            echo "daed=$daed_new"; echo "wing=$wing_new"; echo "core_up=$core_up_new"
            echo "outbound=$outbound_new"
            echo "ver=$ver"
            echo "changes=$changes"
          } >> "$GITHUB_OUTPUT"

      - name: Sync kenzok8 forks from olicesx
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          gh repo sync kenzok8/outbound -b perf/complete-optimizations --source olicesx/outbound --force
          # dae core: mirror kdae as delete-insurance; build still pins frozen CORE_COMMIT (an ancestor of kdae), so output is unchanged.
          gh repo sync kenzok8/dae -b kdae --source olicesx/dae --force
          # quic-go: mirror the branch QUICGO_BASE_COMMIT lives on — assemble fetches it from our fork.
          gh repo sync kenzok8/quic-go -b perf/skip-addr-parse --source olicesx/quic-go --force

      - name: Stage new pins
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.detect.outputs.ver }}
        run: |
          set -eu
          sed -i \
            -e "s/^DAE_VERSION=.*/DAE_VERSION=$V/" \
            -e "s/^DAED_VERSION=.*/DAED_VERSION=$V/" \
            -e "s/^DAED_COMMIT=.*/DAED_COMMIT=${{ steps.detect.outputs.daed }}/" \
            -e "s/^WING_COMMIT=.*/WING_COMMIT=${{ steps.detect.outputs.wing }}/" \
            -e "s/^CORE_UPSTREAM_COMMIT=.*/CORE_UPSTREAM_COMMIT=${{ steps.detect.outputs.core_up }}/" \
            -e "s/^OUTBOUND_COMMIT=.*/OUTBOUND_COMMIT=${{ steps.detect.outputs.outbound }}/" \
            ci/pins.env
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$STAGING"
          git add ci/pins.env
          git commit -m "chore: bump pins (${{ steps.detect.outputs.changes }})"
          git push -f origin "$STAGING"

      - name: Assemble + gate build on staging
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          run_and_wait() { # <workflow-file> [extra dispatch args...]
            gh workflow run "$1" --ref "$STAGING" "${@:2}"
            sleep 12
            LAST_RUN_ID=$(gh run list --workflow "$1" --branch "$STAGING" --limit 1 --json databaseId --jq '.[0].databaseId')
            echo "watching $1 run $LAST_RUN_ID"
            gh run watch "$LAST_RUN_ID" --exit-status
          }
          run_and_wait assemble-dae-src.yml
          run_and_wait assemble-daed-src.yml
          # gate: real SDK compile, no publish. gh-action-sdk exits 0 on failure, so assert the packages exist.
          run_and_wait test-daed-build.yml -f packages="dae daed"
          rm -rf gate-artifacts
          gh run download "$LAST_RUN_ID" -D gate-artifacts
          for pkg in dae daed; do
            find gate-artifacts -name "${pkg}-*.apk" -o -name "${pkg}_*.ipk" | grep -q . || {
              echo "gate failed: $pkg produced no package"; exit 1; }
          done

      - name: Promote to main and publish
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git fetch origin "$STAGING"
          git push origin "origin/$STAGING:main"
          # Dispatch from the already-stable staging ref. Immediately resolving
          # main after the push can briefly return its previous SHA.
          gh workflow run release.yml --ref "$STAGING" -f prerelease=false || \
            gh workflow run release.yml --ref "$STAGING"

  patch-absorbed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check whether upstream absorbed our patches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          absorbed=""
          scan() { # <pkgdir> <src subdir inside the tarball>
            makefile="$1/Makefile"
            src=$(sed -n 's/^PKG_SOURCE:=//p' "$makefile")
            url=$(sed -n 's/^PKG_SOURCE_URL:=//p' "$makefile")
            ver=$(sed -n 's/^PKG_VERSION:=//p' "$makefile")
            [ -n "$src" ] && [ -n "$url" ] || return 0
            rm -rf scan-src scan.tar.gz
            curl -fsSL -o scan.tar.gz "$url/$src" || return 0
            mkdir scan-src
            tar xzf scan.tar.gz -C scan-src
            d="scan-src/$1-$ver/$2"
            [ -d "$d" ] || return 0
            for p in "$1"/patches/*.patch; do
              [ -f "$p" ] || continue
              if patch -p1 -d "$d" --dry-run -R -f <"$p" >/dev/null 2>&1; then
                absorbed="${absorbed}\n- \`$p\`"
              fi
            done
          }
          scan dae core
          scan daed wing
          title="🧹 patches: upstream absorbed some of ours"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "upstream absorbed in:title" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -z "$absorbed" ]; then
            echo "no patch is redundant."
            [ -n "$existing" ] && gh issue close "$existing" --repo "$GITHUB_REPOSITORY" -c "No redundant patch left; auto-closing." || true
            exit 0
          fi
          echo "::warning::these patches already exist upstream and can be dropped."
          body=$(printf 'Automated check (auto-bump.yml).\n\nThese patches reverse-apply cleanly against the pinned source, meaning upstream already carries them. Keeping them risks a conflict on the next bump:\n%b\n\nDrop them (and bump PKG_RELEASE) after confirming the feature is still present.' "$absorbed")
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

  # Independent watchdog: our quic-go = QUICGO_BASE + ci/patches/quic-go. The
  # binding constraint is the quic-go that olicesx/outbound requires, since we
  # track its perf branch and it runs ahead of daeuniverse/dae main. When it moves
  # past our base, auto-bump holds outbound and this opens the refresh reminder
  # (ci/PERF-PATCHES.md). Comparing to quic-go/quic-go releases is meaningless:
  # the perf lineage is an old, API-incompatible base on purpose. Never blocks.
  perf-staleness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check quic-go vs what outbound requires
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          . ci/pins.env
          # the quic-go commit olicesx/outbound's perf branch pins (go.mod replace target)
          want=$(curl -fsSL https://raw.githubusercontent.com/olicesx/outbound/perf/complete-optimizations/go.mod \
            | grep -E '^replace .*olicesx/quic-go' \
            | sed -E 's/.*-([0-9a-f]{12})[[:space:]]*$/\1/' | tail -1)
          ours="$(printf '%s' "$QUICGO_PERF_TIP" | cut -c1-12)"
          echo "outbound requires quic-go ...${want:-?} ; ours reproduces ...${ours}"
          contains=""
          if [ -n "$want" ] && [ "$want" != "$ours" ]; then
            st=$(gh api "repos/${GITHUB_REPOSITORY_OWNER}/quic-go/compare/${want}...${QUICGO_BASE_COMMIT}" \
                   --jq '.status' 2>/dev/null || echo "")
            case "$st" in
              identical|ahead) contains=1; echo "our base already contains ...${want} (compare: ${st})" ;;
            esac
          fi
          if [ -z "$want" ] || [ "$want" = "$ours" ] || [ -n "$contains" ]; then
            echo "quic-go in sync with outbound; no alert."
            # auto-close a stale tracking issue if one is open
            n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
                  --jq 'map(select(.title | test("^⚠️ quic-go: outbound moved to "))) | .[0].number // empty')
            [ -n "$n" ] && gh issue close "$n" --repo "$GITHUB_REPOSITORY" -c "Back in sync with outbound's quic-go; auto-closing." || true
            exit 0
          fi
          echo "::warning::outbound moved quic-go to ${want}; refresh QUICGO_BASE_COMMIT per ci/PERF-PATCHES.md."
          title="⚠️ quic-go: outbound moved to ${want}"
          body=$(printf '%s\n' \
            "Automated check (auto-bump.yml)." \
            "" \
            "- **olicesx/outbound** \`perf/complete-optimizations\` now requires quic-go \`...${want}\`" \
            "- our base+patches reproduce \`...${ours}\` (QUICGO_PERF_TIP)" \
            "" \
            "Until these match, auto-bump holds OUTBOUND_COMMIT and dae/daed stay on the" \
            "last good combo. Refresh following ci/PERF-PATCHES.md, then update" \
            "QUICGO_BASE_COMMIT + QUICGO_PERF_TIP. Heads-up, not an emergency.")
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
                       --jq 'map(select(.title | test("^⚠️ quic-go: outbound moved to "))) | .[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
