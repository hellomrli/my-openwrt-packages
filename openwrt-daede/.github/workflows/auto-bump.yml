name: Check dae/daed upstream

# Scheduled runs report upstream changes without modifying pins or publishing.
# Manual runs assemble and validate a candidate on an isolated staging branch.

on:
  schedule:
    - cron: '30 */6 * * *'
    - cron: '30 19 * * 0'
  workflow_dispatch:
    inputs:
      lane:
        description: Upstream sync lane
        required: true
        default: core
        type: choice
        options:
          - core
          - perf

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-bump-dae-daed
  cancel-in-progress: false

env:
  STAGING: auto-bump-staging-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select sync lane
        id: lane
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_LANE: ${{ inputs.lane }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            lane="$REQUESTED_LANE"
          elif [ "$EVENT_NAME" = schedule ] && [ "$SCHEDULE" = '30 19 * * 0' ]; then
            lane=perf
          else
            lane=core
          fi
          echo "lane=$lane" >> "$GITHUB_OUTPUT"
          echo "Selected $lane lane."

      - name: Detect upstream changes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          LANE: ${{ steps.lane.outputs.lane }}
        run: |
          set -euo pipefail
          . ci/pins.env
          changes=""
          require_sha() {
            if ! [[ "$1" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::$2 is not a full 40-character commit SHA: ${1:-<empty>}"
              exit 1
            fi
          }
          require_date() {
            if ! [[ "$1" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]; then
              echo "::error::$2 is not YYYY.MM.DD: ${1:-<empty>}"
              exit 1
            fi
          }
          add_change() {
            [ "$2" = "$3" ] && return 0
            changes="${changes:+$changes, }$1 $(printf '%s' "$2" | cut -c1-7)→$(printf '%s' "$3" | cut -c1-7)"
          }
          require_date "$DAE_VERSION" DAE_VERSION

          case "$LANE" in
            core)
              daed_new=$(git ls-remote https://github.com/daeuniverse/daed HEAD | cut -f1)
              wing_new=$(git ls-remote https://github.com/daeuniverse/dae-wing HEAD | cut -f1)
              # Route A: track upstream dae main (merged onto the frozen olicesx
              # perf base at assemble time), so the core stays fresh.
              core_up_new=$(git ls-remote https://github.com/daeuniverse/dae main | cut -f1)
              require_sha "$daed_new" daed
              require_sha "$wing_new" dae-wing
              require_sha "$core_up_new" dae-core
              if [ "$daed_new" = "$DAED_COMMIT" ] && [ "$wing_new" = "$WING_COMMIT" ] \
                 && [ "$core_up_new" = "$CORE_UPSTREAM_COMMIT" ]; then
                echo "No core upstream change."
                echo "changed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              daed_date=$(gh api "repos/daeuniverse/daed/commits/$daed_new" --jq '.commit.committer.date' | cut -dT -f1 | tr '-' '.')
              wing_date=$(gh api "repos/daeuniverse/dae-wing/commits/$wing_new" --jq '.commit.committer.date' | cut -dT -f1 | tr '-' '.')
              core_date=$(gh api "repos/daeuniverse/dae/commits/$core_up_new" --jq '.commit.committer.date' | cut -dT -f1 | tr '-' '.')
              require_date "$daed_date" daed-date
              require_date "$wing_date" wing-date
              require_date "$core_date" core-date
              ver=$(printf '%s\n%s\n%s\n%s\n' "$DAE_VERSION" "$daed_date" "$wing_date" "$core_date" | sort -r | head -1)
              require_date "$ver" core-version
              add_change daed "$DAED_COMMIT" "$daed_new"
              add_change wing "$WING_COMMIT" "$wing_new"
              add_change core "$CORE_UPSTREAM_COMMIT" "$core_up_new"
              {
                echo "changed=true"
                echo "daed=$daed_new"
                echo "wing=$wing_new"
                echo "core_up=$core_up_new"
                echo "ver=$ver"
                echo "changes=$changes"
              } >> "$GITHUB_OUTPUT"
              ;;
            perf)
              outbound_new=$(git ls-remote https://github.com/olicesx/outbound perf/complete-optimizations | cut -f1)
              require_sha "$outbound_new" outbound
              quicgo_suffix=$(curl -fsSL "https://raw.githubusercontent.com/olicesx/outbound/${outbound_new}/go.mod" \
                | sed -nE '/^replace .*olicesx\/quic-go/ s/.*-([0-9a-f]{12})[[:space:]]*$/\1/p' | tail -1)
              if ! [[ "$quicgo_suffix" =~ ^[0-9a-f]{12}$ ]]; then
                echo "::error::cannot parse the quic-go commit from outbound ${outbound_new}"
                exit 1
              fi
              quicgo_new=$(gh api "repos/olicesx/quic-go/commits/$quicgo_suffix" --jq '.sha')
              require_sha "$quicgo_new" quic-go
              if [ "$outbound_new" = "$OUTBOUND_COMMIT" ] \
                 && [ "$quicgo_new" = "$QUICGO_BASE_COMMIT" ] \
                 && [ "$quicgo_new" = "$QUICGO_PERF_TIP" ]; then
                echo "No perf upstream change."
                echo "changed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              outbound_date=$(gh api "repos/olicesx/outbound/commits/$outbound_new" --jq '.commit.committer.date' | cut -dT -f1 | tr '-' '.')
              quicgo_date=$(gh api "repos/olicesx/quic-go/commits/$quicgo_new" --jq '.commit.committer.date' | cut -dT -f1 | tr '-' '.')
              require_date "$outbound_date" outbound-date
              require_date "$quicgo_date" quic-go-date
              ver=$(printf '%s\n%s\n%s\n' "$DAE_VERSION" "$outbound_date" "$quicgo_date" | sort -r | head -1)
              require_date "$ver" perf-version
              add_change outbound "$OUTBOUND_COMMIT" "$outbound_new"
              if [ "$QUICGO_BASE_COMMIT" != "$quicgo_new" ] \
                 || [ "$QUICGO_PERF_TIP" != "$quicgo_new" ]; then
                old_quicgo="$(printf '%.7s/%.7s' "$QUICGO_BASE_COMMIT" "$QUICGO_PERF_TIP")"
                changes="${changes:+$changes, }quic-go ${old_quicgo}→$(printf '%s' "$quicgo_new" | cut -c1-7)"
              fi
              {
                echo "changed=true"
                echo "outbound=$outbound_new"
                echo "quicgo=$quicgo_new"
                echo "ver=$ver"
                echo "changes=$changes"
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::unknown sync lane: $LANE"
              exit 1
              ;;
          esac

      - name: Summarize scheduled upstream check
        if: github.event_name == 'schedule'
        env:
          LANE: ${{ steps.lane.outputs.lane }}
          CHANGED: ${{ steps.detect.outputs.changed }}
          CHANGES: ${{ steps.detect.outputs.changes }}
          DAED_SHA: ${{ steps.detect.outputs.daed }}
          WING_SHA: ${{ steps.detect.outputs.wing }}
          CORE_SHA: ${{ steps.detect.outputs.core_up }}
          OUTBOUND_SHA: ${{ steps.detect.outputs.outbound }}
          QUICGO_SHA: ${{ steps.detect.outputs.quicgo }}
        run: |
          if [ "$CHANGED" = true ]; then
            echo "::warning::Upstream update pending compatibility review: $CHANGES"
          fi
          {
            echo "## $LANE upstream check"
            if [ "$CHANGED" = true ]; then
              echo "Pending review: $CHANGES"
              if [ "$LANE" = core ]; then
                echo "daed: \`$DAED_SHA\`"
                echo "dae-wing: \`$WING_SHA\`"
                echo "dae core: \`$CORE_SHA\`"
              else
                echo "outbound: \`$OUTBOUND_SHA\`"
                echo "quic-go: \`$QUICGO_SHA\`"
              fi
              echo "Run this workflow manually to build and validate the candidate."
            else
              echo "No upstream change."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-go@v6
        if: github.event_name == 'workflow_dispatch' && steps.detect.outputs.changed == 'true'
        with:
          go-version: "1.26.0"

      - name: Sync kenzok8 forks from olicesx
        if: github.event_name == 'workflow_dispatch' && steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          LANE: ${{ steps.lane.outputs.lane }}
          QUICGO_COMMIT: ${{ steps.detect.outputs.quicgo }}
        run: |
          set -euo pipefail
          if [ "$LANE" = core ]; then
            # Mirror kdae as delete-insurance; builds still pin frozen CORE_COMMIT.
            gh repo sync kenzok8/dae -b kdae --source olicesx/dae --force
            exit 0
          fi
          if ! [[ "$QUICGO_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::quic-go is not a full 40-character commit SHA: ${QUICGO_COMMIT:-<empty>}"
            exit 1
          fi

          gh repo sync kenzok8/outbound -b perf/complete-optimizations --source olicesx/outbound --force
          # Keep every pinned quic-go object on an immutable fork ref; the short
          # alias is only a convenience and is never its sole long-term reference.
          temp_dir=$(mktemp -d)
          trap 'rm -rf "$temp_dir"' EXIT
          git init -q "$temp_dir/quic-go"
          git -C "$temp_dir/quic-go" remote add upstream https://github.com/olicesx/quic-go.git
          git -C "$temp_dir/quic-go" fetch -q --no-tags --depth=1 upstream "$QUICGO_COMMIT"
          fetched_quicgo=$(git -C "$temp_dir/quic-go" rev-parse FETCH_HEAD)
          if ! [[ "$fetched_quicgo" =~ ^[0-9a-f]{40}$ ]] || [ "$fetched_quicgo" != "$QUICGO_COMMIT" ]; then
            echo "::error::fetched quic-go $fetched_quicgo, expected $QUICGO_COMMIT"
            exit 1
          fi
          git -C "$temp_dir/quic-go" remote add origin https://github.com/kenzok8/quic-go.git
          immutable_branch="daede-pinned-${QUICGO_COMMIT}"
          immutable_sha=$(git -C "$temp_dir/quic-go" ls-remote --heads origin "refs/heads/$immutable_branch" | cut -f1)
          if [ -n "$immutable_sha" ]; then
            if ! [[ "$immutable_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::$immutable_branch resolved to an invalid SHA: $immutable_sha"
              exit 1
            fi
            if [ "$immutable_sha" != "$QUICGO_COMMIT" ]; then
              echo "::error::$immutable_branch already points to $immutable_sha, expected $QUICGO_COMMIT"
              exit 1
            fi
            echo "$immutable_branch already preserves $QUICGO_COMMIT."
          else
            git -C "$temp_dir/quic-go" -c credential.helper='!gh auth git-credential' \
              push origin "FETCH_HEAD:refs/heads/$immutable_branch"
          fi
          git -C "$temp_dir/quic-go" -c credential.helper='!gh auth git-credential' \
            push --force origin "FETCH_HEAD:refs/heads/daede-pinned"

      - name: Stage new pins
        id: stage
        if: github.event_name == 'workflow_dispatch' && steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LANE: ${{ steps.lane.outputs.lane }}
          V: ${{ steps.detect.outputs.ver }}
        run: |
          set -euo pipefail
          case "$LANE" in
            core)
              sed -i \
                -e "s/^DAE_VERSION=.*/DAE_VERSION=$V/" \
                -e "s/^DAED_VERSION=.*/DAED_VERSION=$V/" \
                -e "s/^DAED_COMMIT=.*/DAED_COMMIT=${{ steps.detect.outputs.daed }}/" \
                -e "s/^WING_COMMIT=.*/WING_COMMIT=${{ steps.detect.outputs.wing }}/" \
                -e "s/^CORE_UPSTREAM_COMMIT=.*/CORE_UPSTREAM_COMMIT=${{ steps.detect.outputs.core_up }}/" \
                ci/pins.env
              ;;
            perf)
              sed -i \
                -e "s/^DAE_VERSION=.*/DAE_VERSION=$V/" \
                -e "s/^DAED_VERSION=.*/DAED_VERSION=$V/" \
                -e "s/^OUTBOUND_COMMIT=.*/OUTBOUND_COMMIT=${{ steps.detect.outputs.outbound }}/" \
                -e "s/^QUICGO_BASE_COMMIT=.*/QUICGO_BASE_COMMIT=${{ steps.detect.outputs.quicgo }}/" \
                -e "s/^QUICGO_PERF_TIP=.*/QUICGO_PERF_TIP=${{ steps.detect.outputs.quicgo }}/" \
                ci/pins.env
              ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$STAGING"
          git add ci/pins.env
          git commit -m "chore: bump pins (${{ steps.detect.outputs.changes }})"
          staging_sha=$(git rev-parse HEAD)
          if ! [[ "$staging_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::staging commit is not a full 40-character SHA: $staging_sha"
            exit 1
          fi
          git -c credential.helper='!gh auth git-credential' \
            push --force origin "HEAD:refs/heads/$STAGING"
          echo "staging_sha=$staging_sha" >> "$GITHUB_OUTPUT"

      - name: Assemble + gate build on staging
        id: gate
        if: github.event_name == 'workflow_dispatch' && steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          INITIAL_SHA: ${{ steps.stage.outputs.staging_sha }}
        run: |
          set -euo pipefail
          require_sha() {
            if ! [[ "$1" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::$2 is not a full 40-character commit SHA: ${1:-<empty>}"
              exit 1
            fi
          }
          fetch_staging_sha() {
            git fetch -q --force origin "refs/heads/$STAGING"
            fetched_sha=$(git rev-parse FETCH_HEAD)
            require_sha "$fetched_sha" staging
            printf '%s\n' "$fetched_sha"
          }
          wait_run() {
            local id=$1 fails=0 out status conclusion
            while :; do
              if out=$(gh run view "$id" --json status,conclusion --jq '.status + " " + (.conclusion // "")' 2>&1); then
                fails=0
                read -r status conclusion <<<"$out"
                if [ "$status" = completed ]; then
                  echo "run $id finished: $conclusion"
                  if [ "$conclusion" != success ]; then
                    echo "::error::run $id concluded $conclusion"
                    return 1
                  fi
                  return 0
                fi
              else
                fails=$((fails + 1))
                echo "::warning::polling run $id failed ($fails/20): $out"
                if [ "$fails" -ge 20 ]; then
                  echo "::error::cannot poll run $id"
                  return 1
                fi
              fi
              sleep 30
            done
          }
          run_and_wait() { # <workflow-file> <expected-sha> [dispatch args...]
            workflow=$1
            expected_sha=$2
            shift 2
            require_sha "$expected_sha" "$workflow expected head"
            remote_sha=$(fetch_staging_sha)
            if [ "$remote_sha" != "$expected_sha" ]; then
              echo "::error::$STAGING moved to $remote_sha before dispatching $workflow; expected $expected_sha"
              exit 1
            fi
            dispatch_output=$(gh workflow run "$workflow" --ref "$STAGING" "$@")
            echo "$dispatch_output"
            run_id=$(printf '%s\n' "$dispatch_output" \
              | sed -nE 's|.*actions/runs/([0-9]+).*|\1|p' | tail -1)
            if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
              echo "::error::cannot read dispatched $workflow run ID"
              exit 1
            fi
            actual_sha=""
            for _ in {1..60}; do
              if actual_sha=$(gh run view "$run_id" --json headSha --jq '.headSha' 2>/dev/null); then
                break
              fi
              sleep 2
            done
            require_sha "$actual_sha" "$workflow run head"
            if [ "$actual_sha" != "$expected_sha" ]; then
              echo "::error::$workflow run $run_id uses $actual_sha, expected $expected_sha"
              exit 1
            fi
            echo "watching $workflow run $run_id at $expected_sha"
            wait_run "$run_id"
            LAST_RUN_ID=$run_id
          }

          require_sha "$INITIAL_SHA" initial-staging
          current_sha=$(fetch_staging_sha)
          if [ "$current_sha" != "$INITIAL_SHA" ]; then
            echo "::error::$STAGING starts at $current_sha, expected $INITIAL_SHA"
            exit 1
          fi
          run_and_wait assemble-dae-src.yml "$current_sha"
          current_sha=$(fetch_staging_sha)
          run_and_wait assemble-daed-src.yml "$current_sha"
          tested_sha=$(fetch_staging_sha)
          audit_dir=$(mktemp -d)
          trap 'rm -rf "$audit_dir"' EXIT
          git archive "$tested_sha" | tar -x -C "$audit_dir"
          env -u GH_TOKEN -u GITHUB_TOKEN bash "$audit_dir/scripts/audit-upstream.sh" "$audit_dir"
          # A single real SDK build catches wing/core compile errors before the
          # full matrix. The test workflow also checks for both package files.
          run_and_wait test-daed-build.yml "$tested_sha" -f packages="dae daed" -f arch=x86_64 -f sdk=25.12
          # Full release matrix, no publish. gh-action-sdk exits 0 on failure,
          # so assert every expected package artifact exists.
          run_and_wait test-daed-build.yml "$tested_sha" -f packages="dae daed"
          gate_run_id=$LAST_RUN_ID
          after_gate_sha=$(fetch_staging_sha)
          if [ "$after_gate_sha" != "$tested_sha" ]; then
            echo "::error::$STAGING moved to $after_gate_sha after gate tested $tested_sha"
            exit 1
          fi
          rm -rf gate-artifacts
          mkdir -p gate-artifacts
          artifacts=(
            pkgs-aarch64_cortex-a53-24.10
            pkgs-aarch64_cortex-a53-25.12
            pkgs-aarch64_cortex-a72-24.10
            pkgs-aarch64_cortex-a72-25.12
            pkgs-aarch64_generic-24.10
            pkgs-aarch64_generic-25.12
            pkgs-arm_cortex-a7_neon-vfpv4-24.10
            pkgs-arm_cortex-a7_neon-vfpv4-25.12
            pkgs-arm_cortex-a9-24.10
            pkgs-arm_cortex-a9-25.12
            pkgs-arm_cortex-a9_neon-24.10
            pkgs-arm_cortex-a9_neon-25.12
            pkgs-i386_pentium4-24.10
            pkgs-i386_pentium4-25.12
            pkgs-x86_64-24.10
            pkgs-x86_64-25.12
          )
          for artifact in "${artifacts[@]}"; do
            gh run download "$gate_run_id" --name "$artifact" --dir "gate-artifacts/$artifact"
            [ -d "gate-artifacts/$artifact" ] || {
              echo "::error::missing downloaded artifact directory: $artifact"
              exit 1
            }
            for package in dae daed; do
              found=0
              while IFS= read -r -d '' file; do
                name=${file##*/}
                case "$name" in
                  "$package"-*.apk|"$package"_*.apk|"$package"-*.ipk|"$package"_*.ipk)
                    found=1
                    break
                    ;;
                esac
              done < <(find "gate-artifacts/$artifact" -type f \( -name '*.apk' -o -name '*.ipk' \) -print0)
              [ "$found" -eq 1 ] || {
                echo "::error::$artifact has no $package package artifact"
                exit 1
              }
            done
          done
          echo "validated exact package artifacts: ${artifacts[*]}"
          echo "tested_sha=$tested_sha" >> "$GITHUB_OUTPUT"
          {
            echo "## Candidate ready for 252 testing"
            echo "Staging branch: \`$STAGING\`"
            echo "Validated commit: \`$tested_sha\`"
            echo "16 SDK package sets contain dae and daed."
            echo "Promote only after 252 testing and maintainer approval."
          } >> "$GITHUB_STEP_SUMMARY"
