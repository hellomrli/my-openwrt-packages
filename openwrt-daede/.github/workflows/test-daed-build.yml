name: Test daed build

# Iteration-only: builds dae/daed for one arch and uploads the .apk as an artifact.
# No feed upload, no release — safe to run on feature branches.

on:
  workflow_dispatch:
    inputs:
      packages:
        description: Packages to build
        default: "dae daed"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64_generic]
        sdk: ["24.10", "25.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Build packages
        id: sdk
        continue-on-error: true
        uses: kenzok8/gh-action-sdk@hash
        env:
          CONTAINER: immortalwrt/sdk
          ARCH: ${{ matrix.arch }}-openwrt-${{ matrix.sdk }}
          FEEDNAME: daede
          PACKAGES: ${{ github.event.inputs.packages }}
          EXTRA_FEEDS: src-git|wall|https://github.com/kenzok8/wall
          NO_REFRESH_CHECK: true
          IGNORE_ERRORS: false
          INDEX: 1
          KEY_BUILD: ${{ secrets.OPKG_KEY_BUILD }}
          PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}
          GOLANG_REPO: https://github.com/kenzok8/golang
          GOLANG_BRANCH: '1.26'

      - name: Validate requested packages
        id: validate
        if: always()
        env:
          SDK_OUTCOME: ${{ steps.sdk.outcome }}
          PACKAGES: ${{ github.event.inputs.packages }}
        run: |
          set -euo pipefail
          if [ "$SDK_OUTCOME" != success ]; then
            echo "::error::SDK action concluded $SDK_OUTCOME"
            exit 1
          fi

          read -r -a requested <<< "$PACKAGES"
          [ "${#requested[@]}" -gt 0 ] || {
            echo "::error::packages input is empty"
            exit 1
          }
          output_dir="bin/packages/${{ matrix.arch }}/daede"
          for package in "${requested[@]}"; do
            found=0
            while IFS= read -r -d '' file; do
              name=${file##*/}
              case "$name" in
                "$package"-*.apk|"$package"_*.apk|"$package"-*.ipk|"$package"_*.ipk)
                  found=1
                  break
                  ;;
              esac
            done < <(find "$output_dir" -maxdepth 1 -type f \( -name '*.apk' -o -name '*.ipk' \) -print0 2>/dev/null || true)
            if [ "$found" -ne 1 ]; then
              echo "::error::requested package $package has no .apk or .ipk artifact"
              exit 1
            fi
            echo "validated package $package"
          done

      - name: Upload package artifacts
        if: steps.sdk.outcome == 'success' && steps.validate.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: pkgs-${{ matrix.arch }}-${{ matrix.sdk }}
          path: |
            bin/packages/${{ matrix.arch }}/daede/*.apk
            bin/packages/${{ matrix.arch }}/daede/*.ipk
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: logs-${{ matrix.arch }}-${{ matrix.sdk }}
          path: |
            logs/**
            *.log
            **/*.log
          if-no-files-found: ignore
